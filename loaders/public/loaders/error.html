<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a09">
<title>Klepai loader — Error</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#090a09;color:#898989;font-family:"ADLaM Display",Arial,sans-serif}
.preview{display:flex;align-items:center;gap:12px}
.mark{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.dot{display:block;width:4px;height:4px;background:#3b3b3b}
.dot:nth-child(1),.dot:nth-child(3),.dot:nth-child(5),.dot:nth-child(7),.dot:nth-child(9){background:#f04444;box-shadow:0 0 5px #f0444470}
.status{color:inherit;font-size:12px;line-height:16px;white-space:nowrap}
</style>
</head>
<body>
<main class="preview" aria-label="Agent status: Error">
<span class="mark grid" role="img" aria-label="Czerwony X ułożony z pięciu pól siatki 3 na 3"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
<span class="status">Error</span>
</main>
</body>
</html>
