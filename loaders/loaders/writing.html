<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a09">
<title>Klepai loader — Writing</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#090a09;color:#f4f3ee;font-family:"ADLaM Display",Arial,sans-serif}
.preview{display:flex;align-items:center;gap:12px}
.grid{display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.dot{display:block;width:4px;height:4px;background:currentColor;opacity:.15}
.status{color:inherit;font-size:12px;line-height:16px;white-space:nowrap}
</style>
</head>
<body>
<main class="preview" aria-label="Agent status: Writing">
<span class="grid" id="loader" role="img" aria-label="Kwadrat wypełniający się pole po polu"></span>
<span class="status">Writing</span>
</main>
<script>
const grid = document.getElementById("loader");
const count = 9;
const duration = 2400;

for (let index = 0; index < count; index += 1) {
  const square = document.createElement("i");
  square.className = "dot";
  grid.append(square);

  const start = index / count;
  const finish = (index + 1) / count;
  square.animate(
    [
      { opacity: 0.15, offset: 0 },
      { opacity: 0.15, offset: start },
      { opacity: 1, offset: finish },
      { opacity: 1, offset: 1 },
    ],
    { duration, iterations: Infinity, easing: "linear" },
  );
}
</script>
</body>
</html>
