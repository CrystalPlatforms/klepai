# CI — test + artifacts for the platforms Klepai does not hand-validate.
#
# macOS is the hand-validated platform (PRD story 33): `cargo test` and
# `tauri build` run on the owner's Mac, and every HITL checklist step happens
# there. This workflow covers the rest of the matrix:
#   - Linux: full pass — frontend tests, Rust integration tests, installers.
#   - Windows: frontend tests + installers (the Rust suite drives `sh -c`
#     in its agent fixtures, so it stays a Linux/macOS concern for now).
#
# Artifacts are unsigned Alpha bundles (per issue #14: no code signing in
# Alpha). The updater signing step is switched off through
# `tauri.ci.conf.json` — CI holds no TAURI_SIGNING_PRIVATE_KEY, and the
# updater feed only exists once a real release is published.
#
# Runs on every push to main, plus a manual button (workflow_dispatch) so a
# release candidate can be rebuilt on demand.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test + artifacts (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Tauri v2 system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Frontend tests
        run: npm ci && npm test

      - name: Rust tests
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: klepai-windows
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: klepai-linux
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
