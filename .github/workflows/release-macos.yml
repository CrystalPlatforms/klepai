# Release macOS — builds the Apple Silicon .dmg for every published release
# and attaches it to the release (versioned name + the permanent
# `klepai-macos.dmg` alias the landing page downloads through).
#
# macOS is klepai's hand-validated platform (PRD story 33): the HITL
# checklist still happens on the owner's Mac, but the SHIPPED dmg no longer
# has to be hand-built there — this workflow builds it from the tag.
# The build uses tauri.ci.conf.json, so the dmg is an unsigned Alpha bundle
# (issue #14: no code signing in Alpha; no updater signature from CI —
# the signed .app.tar.gz/.sig updater bundle stays an optional owner-side
# build, exactly like today).
#
# workflow_dispatch (manual button) has no release to attach to — it leaves
# the dmg as a run artifact for test-builds.

name: release-macos

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 needs Node ≥ 24 (same as ci.yml).
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Frontend tests
        run: npm ci && npm test

      # Updater feed: with the TAURI_SIGNING_PRIVATE_KEY secret present this
      # is a FULL signed build (Klepai.app.tar.gz + .sig + latest.json land on
      # the release and installed macOS apps detect the update). Without the
      # secret it falls back to the unsigned Alpha dmg (tauri.ci.conf.json).
      - name: Build (signed updater feed when the secret exists)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signing secret present — full signed build (updater feed on)"
            npx tauri build
          else
            echo "no signing secret — unsigned Alpha build (tauri.ci.conf.json)"
            npx tauri build --config src-tauri/tauri.ci.conf.json
          fi

      - name: Attach dmg to the release (versioned + permanent alias)
        if: github.event.release.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" klepai-macos.dmg
          gh release upload "$TAG" --clobber "$DMG" klepai-macos.dmg \
            --repo "$GITHUB_REPOSITORY"

      # When the signed build ran, this also publishes the updater feed:
      # Klepai.app.tar.gz + .sig + a generated latest.json for darwin-aarch64.
      - name: Attach updater feed to the release (signed builds only)
        if: github.event.release.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          UPD_TAR=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$UPD_TAR" ]; then
            echo "unsigned build — no updater feed to publish"
            exit 0
          fi
          SIG="$UPD_TAR.sig"
          VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const sig = fs.readFileSync(process.argv[1], "utf8").trim();
            const feed = {
              version: tag.replace(/^v/, ""),
              notes: "Release " + tag,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: sig,
                  url: "https://github.com/CrystalPlatforms/klepai/releases/download/" + tag + "/Klepai.app.tar.gz",
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2));
          ' "$SIG"
          gh release upload "$TAG" --clobber "$UPD_TAR" "$SIG" latest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload dmg as run artifact (manual runs)
        if: github.event.release.tag_name == ''
        uses: actions/upload-artifact@v4
        with:
          name: klepai-macos
          if-no-files-found: error
          # upload-artifact does NOT inherit defaults.run.working-directory —
          # the path is relative to the repo root (the app lives in app/).
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
